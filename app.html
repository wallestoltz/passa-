<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Passa</title>
<style>
/* Layout: app-skal med vitt sidhuvud och innehåll upp till 1120px. Mobil: flikrad i botten. Dator: navigering i sidhuvudet, kalendern med dagpanel till höger */
:root{
  --bg:#fbf7ee; --surface:#ffffff; --surface-2:#f6f1e6; --ink:#173a3b; --muted:#5d7270; --line:#ebe3d3; --line-2:#dcd2bd;
  --green:#173a3b; --green-soft:#e3ece8; --on-green:#fbf7ee;
  --orange:#fd795b; --orange-soft:#ffe8e0; --on-orange:#173a3b; --orange-ink:#a8401f;
  --ok:#2c7a54; --ok-soft:#e1f1e8;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
  --shadow:0 1px 2px rgba(23,58,59,.05),0 6px 18px rgba(23,58,59,.06);
  --shadow-lg:0 2px 6px rgba(23,58,59,.06),0 18px 44px rgba(23,58,59,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f2627; --surface:#153233; --surface-2:#122c2d; --ink:#f3f0e8; --muted:#a3bab5; --line:#244746; --line-2:#2f5655;
  --green:#d3e8e1; --green-soft:#1d4344; --on-green:#0f2627;
  --orange:#fd795b; --orange-soft:#4a2a20; --on-orange:#173a3b; --orange-ink:#ffb49f;
  --ok:#7fd3a7; --ok-soft:#1c3d30;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25); --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 18px 44px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f2627; --surface:#153233; --surface-2:#122c2d; --ink:#f3f0e8; --muted:#a3bab5; --line:#244746; --line-2:#2f5655;
  --green:#d3e8e1; --green-soft:#1d4344; --on-green:#0f2627;
  --orange:#fd795b; --orange-soft:#4a2a20; --on-orange:#173a3b; --orange-ink:#ffb49f;
  --ok:#7fd3a7; --ok-soft:#1c3d30;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25); --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 18px 44px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.6vw,2.6rem)} h2{font-size:clamp(1.35rem,3vw,1.7rem)} h3{font-size:1.12rem}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:.875rem} .xs{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Skal */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:1120px;margin:0 auto;min-height:64px;display:flex;align-items:center;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:700;font-size:1.55rem;color:var(--ink)}
.logo .mark{width:32px;height:32px;border-radius:10px 10px 10px 3px;background:var(--orange);color:#173a3b;display:grid;place-items:center}
.logo .mark svg{width:19px;height:19px}
.logo .dot{color:var(--orange)}
.topnav{display:none;gap:2px;margin-left:12px}
.topnav a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.93rem;position:relative}
.topnav a svg{width:17px;height:17px}
.topnav a:hover{color:var(--ink);background:var(--surface-2)}
.topnav a[aria-current="page"]{color:var(--ink);background:var(--green-soft)}
.bar .cta{margin-left:auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:650;position:relative}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--orange)}
.dot-badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--orange);color:#173a3b;font-size:.68rem;font-weight:800;display:grid;place-items:center}
.topnav .dot-badge{position:static;margin-left:2px}
main{padding-bottom:86px}
.page{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.page.narrow{max-width:720px}
@media (min-width:900px){
  .topnav{display:flex}
  .tabs{display:none}
  main{padding-bottom:0}
  .page{padding-block:36px 64px}
}
@media (max-width:380px){.bar .cta span{display:none}}
.foot{border-top:1px solid var(--line);margin-top:24px}
.foot .in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}

/* Komponenter */
.btn{appearance:none;border:0;border-radius:12px;min-height:46px;padding:10px 18px;font-weight:700;font-size:.97rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:var(--on-green);transition:transform .12s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex:none}
.btn.orange{background:var(--orange);color:var(--on-orange)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:38px;padding:7px 13px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{appearance:none;border:1.5px solid var(--line-2);background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.pad-lg{padding:24px}
@media (max-width:520px){.card.pad-lg{padding:18px}}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:750;color:var(--orange-ink)}
.phead{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.phead p{color:var(--muted);max-width:60ch}
label,.lbl{font-weight:650;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line-2);border-radius:11px;padding:10px 12px;min-height:46px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
textarea{min-height:96px;resize:vertical}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:20px;accent-color:var(--green);flex:none;margin:0}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 > *{min-width:0}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:650;font-size:.88rem;margin-bottom:8px;padding:0}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;font-weight:650;font-size:.9rem;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(23,58,59,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.o{background:var(--orange-soft);color:var(--orange-ink)}
.chip.ex{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.status{font-size:.75rem;font-weight:750;padding:3px 10px;border-radius:99px;white-space:nowrap;flex:none;align-self:center;line-height:1.5}
.status.st-req{background:var(--orange-soft);color:var(--orange-ink)}
.status.st-done{background:var(--ok-soft);color:var(--ok)}
.status.st-cancel{background:var(--surface-2);color:var(--muted)}
.status.st-paid{background:var(--green-soft);color:var(--green)}
.note{background:var(--orange-soft);color:var(--orange-ink);border-radius:12px;padding:12px 14px;font-size:.88rem}
.empty{text-align:center;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ill{width:56px;height:56px;border-radius:16px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.empty .ill svg{width:28px;height:28px}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.back{appearance:none;background:none;border:0;color:var(--muted);font-weight:650;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:.92rem}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:650;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
@media (min-width:900px){.toast{bottom:32px}}

/* Avatarer */
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.15rem;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:92px;height:92px;font-size:2rem}
.av.sm{width:42px;height:42px;font-size:.95rem}
.dogav{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.dogav svg{width:26px;height:26px}
.dogav.sm{width:42px;height:42px;border-radius:13px}
.dogav.sm svg{width:21px;height:21px}
.dogav.xl{width:92px;height:92px;border-radius:26px}
.dogav.xl svg{width:44px;height:44px}

/* Start */
.hero{background:#173a3b;color:#fbf7ee;border-radius:26px;padding:28px 22px;display:grid;gap:24px;overflow:hidden}
@media (min-width:900px){.hero{grid-template-columns:minmax(0,1fr) 430px;padding:48px;gap:40px;align-items:center}}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.3rem);color:inherit}
.hero h1 em{color:#fd795b}
.hero .eyebrow{color:#fd795b}
.hero .lead{color:#c3d4d0;font-size:1.08rem;margin-top:14px;max-width:42ch}
.hero .facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px}
.hero .facts div{display:flex;flex-direction:column}
.hero .facts b{font-family:var(--font-display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .facts span{font-size:.82rem;color:#c3d4d0}
.sbox{background:var(--surface);color:var(--ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.25);min-width:0}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
.path{display:flex;gap:16px;align-items:flex-start;text-decoration:none;transition:box-shadow .2s,transform .2s}
.path:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.path > div{min-width:0}
.path .pic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.path .pic svg{width:24px;height:24px}
.path .go{margin-left:auto;align-self:center;color:var(--muted)}
.path .go svg{width:20px;height:20px}
.shead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:40px 0 16px}

/* Listor */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.scard{display:flex;flex-direction:column;gap:12px;transition:box-shadow .2s}
.scard:hover{box-shadow:var(--shadow-lg)}
.scard-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.scard-top > div{min-width:0}
.price{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;white-space:nowrap;font-size:1.05rem}
.price small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stars{color:var(--orange);letter-spacing:1px}

.req{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;padding:14px 16px;transition:box-shadow .2s,border-color .2s}
.req:hover{box-shadow:var(--shadow);border-color:var(--line-2)}
.req .pay{text-align:right;font-variant-numeric:tabular-nums}
.req .pay b{font-size:1.05rem;display:block;white-space:nowrap}
.req .pay small{color:var(--muted);font-size:.74rem;white-space:nowrap}
.reqlist{display:flex;flex-direction:column;gap:10px}

/* Kalender */
.calwrap{display:grid;gap:20px;align-items:start}
.calwrap > *{min-width:0}
@media (min-width:960px){.calwrap{grid-template-columns:minmax(0,1fr) 400px}.daypanel{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.filters label{flex:1 1 160px;min-width:0}
.months{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:8px;scrollbar-width:thin;scroll-snap-type:x proximity}
.months button{appearance:none;flex:none;scroll-snap-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:84px}
.months button b{font-size:.88rem;text-transform:capitalize}
.months button span{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.months button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.months .bar-mini{height:4px;width:100%;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px;display:block}
.months .bar-mini i{display:block;height:100%;background:var(--orange);border-radius:2px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.calhead h2{flex:1;min-width:0;text-transform:capitalize;font-size:1.45rem}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.wk span{text-align:center;font-size:.72rem;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{appearance:none;border:1.5px solid transparent;background:var(--surface-2);border-radius:12px;min-height:56px;padding:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;min-width:0}
.day .d{font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums;line-height:1.5}
.day .c{align-self:flex-end;min-width:22px;height:22px;padding:0 6px;border-radius:99px;font-size:.74rem;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
@media (min-width:600px){.day{aspect-ratio:1/1.05}}
.day.l1 .c{background:var(--orange-soft);color:var(--orange-ink)}
.day.l2 .c{background:var(--orange);color:#173a3b}
.day.l3 .c{background:var(--green);color:var(--on-green)}
.day:hover:not([disabled]){border-color:var(--line-2);background:var(--surface)}
.day.today .d{background:var(--ink);color:var(--bg);border-radius:7px;padding:0 6px}
.day[aria-pressed="true"]{border-color:var(--green);background:var(--surface);box-shadow:var(--shadow)}
.day[disabled]{opacity:.38;cursor:default}
.day.blank{visibility:hidden}
@media (max-width:520px){.day{min-height:48px;border-radius:10px;padding:4px}.day .c{min-width:18px;height:18px;font-size:.68rem;padding:0 4px}.day .d{font-size:.82rem}.wk,.cal{gap:4px}.calhead h2{font-size:1.2rem}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}
.daypanel h2{text-transform:capitalize}

/* Profil och detalj */
.dgrid{display:grid;gap:20px;align-items:start}
.dgrid > *{min-width:0}
@media (min-width:900px){.dgrid{grid-template-columns:minmax(0,1fr) 360px}.dgrid aside{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}}
.ph{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ph > .stack{min-width:0;flex:1 1 220px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin:0}
.facts dt{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.facts dd{margin:3px 0 0;font-weight:650}
.bigprice{font-family:var(--font-display);font-size:2.1rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.plist{display:flex;flex-direction:column;gap:10px}
.plist div{display:flex;justify-content:space-between;gap:10px;align-items:center}
.plist span:first-child{display:inline-flex;gap:8px;align-items:center}
.plist svg{width:16px;height:16px;color:var(--muted)}

/* Chatt och listor */
.chat{display:flex;flex-direction:column;gap:8px;max-height:56vh;min-height:200px;overflow-y:auto;padding:4px}
.msg{max-width:80%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--surface-2);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--green);color:var(--on-green);border-radius:16px 16px 4px 16px}
.msg time{display:block;font-size:.7rem;opacity:.7;margin-top:2px}
.lrow{appearance:none;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;text-decoration:none}
.lrow:hover{border-color:var(--line-2)}

/* Betalning */
.paybox{border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.payopt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line-2);border-radius:12px;padding:12px;cursor:pointer;font-weight:500;flex-direction:row}

/* ---------- Hjälpfunktioner ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const ym = s => s.slice(0,7);
const addMonths = (m,n) => { const d=parse(m+"-01"); d.setMonth(d.getMonth()+n); return ymd(d).slice(0,7); };
const fmtDate = (s,o={weekday:"short",day:"numeric",month:"short"}) => parse(s).toLocaleDateString("sv-SE",o).replace(/\.$/,"");
const fmtLong = s => fmtDate(s,{weekday:"long",day:"numeric",month:"long"});
const fmtMonth = m => parse(m+"-01").toLocaleDateString("sv-SE",{month:"long",year:"numeric"});

function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
function hash(str){ let h=2166136261; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- Betalning via Stripe Connect ----------
   Appen pratar med serverfunktionerna i mappen api/. Utan server (till exempel på GitHub Pages)
   visar appen att kortbetalning inte är påslagen. Kortuppgifter samlas aldrig in här, de skrivs bara in hos Stripe. */
const API="api/";
const PAY={checked:false,ok:false,mode:"",fee:0};
async function api(path,opts={}){
  const res=await fetch(API+path,{headers:{"Content-Type":"application/json"},...opts});
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error||("Servern svarade med fel "+res.status));
  return data;
}
async function checkPay(){
  if(PAY.checked) return PAY;
  try{ const h=await api("health"); PAY.ok=!!h.stripe; PAY.mode=h.mode||""; PAY.fee=+h.feePercent||0; }catch(e){ PAY.ok=false; }
  PAY.checked=true; return PAY;
}
const appUrl=(query,hash)=>location.origin+location.pathname+(query?"?"+query:"")+(hash?"#"+hash:"");
const PAY_OFF_MSG="Kortbetalning är inte påslagen här. Appen behöver köras tillsammans med Passas server och en Stripe-nyckel, se README-filen.";
function stripeLabel(s){ if(s.example) return "Exempelprofil"; if(s.stripeReady) return "Kopplat"; if(s.stripeAccount) return "Inte klart"; return "Inte kopplat"; }
async function refreshStripe(s){
  if(!s||!s.stripeAccount) return;
  try{ const d=await api("connect-status?account="+encodeURIComponent(s.stripeAccount)); s.stripeReady=!!d.chargesEnabled; s.stripePayouts=!!d.payoutsEnabled; save(); }catch(e){}
}
async function connectStripe(s,btn){
  await checkPay(); if(!PAY.ok){ toast(PAY_OFF_MSG); return; }
  const label=btn.innerHTML; btn.disabled=true; btn.textContent="Öppnar Stripe…";
  try{
    const d=await api("connect-onboard",{method:"POST",body:JSON.stringify({accountId:s.stripeAccount||null,returnUrl:appUrl("stripe=klar&sitter="+s.id,"hundvakt-"+s.id),refreshUrl:appUrl("stripe=igen&sitter="+s.id,"hundvakt-"+s.id)})});
    s.stripeAccount=d.accountId; save(); location.href=d.url;
  }catch(e){ btn.disabled=false; btn.innerHTML=label; toast("Det gick inte att öppna Stripe. "+e.message); }
}
async function payWithStripe(b,btn){
  const s=getSitter(b.sitterId);
  await checkPay();
  if(!PAY.ok){ payNote(b,PAY_OFF_MSG); return; }
  if(!s||!s.stripeAccount||!s.stripeReady){ payNote(b, s&&s.example?"Exempelprofiler har inget Stripe-konto och går inte att betala. Skapa en egen annons och koppla Stripe för att testa hela flödet.":"Hundvakten har inte kopplat Stripe än. Skriv till hundvakten och be hen koppla sitt konto under sin annons."); return; }
  const label=btn.innerHTML; btn.disabled=true; btn.textContent="Öppnar Stripe…";
  try{
    const d=await api("checkout",{method:"POST",body:JSON.stringify({bookingId:b.id,amount:Math.round(b.total),description:`${SVC[b.service].label} för ${b.dog||"hunden"} hos ${s.name}`,destination:s.stripeAccount,successUrl:appUrl("betalning=klar&booking="+b.id+"&session_id={CHECKOUT_SESSION_ID}","bokningar"),cancelUrl:appUrl("betalning=avbruten&booking="+b.id,"bokningar")})});
    b.checkoutSession=d.id; save(); location.href=d.url;
  }catch(e){ btn.disabled=false; btn.innerHTML=label; payNote(b,"Det gick inte att starta betalningen. "+e.message); }
}
function payNote(b,msg){
  const box=document.getElementById("rv-"+b.id); if(!box) return;
  box.innerHTML=`<div class="paybox"><p class="small">${esc(msg)}</p><button type="button" class="btn ghost sm" style="align-self:flex-start">Stäng</button></div>`;
  box.querySelector("button").onclick=()=>{box.innerHTML="";};
}
async function handleReturn(){
  const q=new URLSearchParams(location.search); if(!q.toString()) return;
  history.replaceState(null,"",location.pathname+location.hash);
  if(q.get("stripe")){
    const s=getSitter(q.get("sitter")); if(!s) return;
    if(q.get("stripe")==="igen"){ toast("Länken till Stripe gick ut. Tryck på Slutför kopplingen igen."); return; }
    await refreshStripe(s); toast(s.stripeReady?"Stripe är kopplat. Du kan ta emot kortbetalningar.":"Kopplingen är inte klar än. Slutför stegen hos Stripe."); render(); return;
  }
  if(q.get("betalning")){
    const b=S.bookings.find(x=>x.id===q.get("booking")); if(!b) return;
    if(q.get("betalning")==="avbruten"){ toast("Betalningen avbröts. Inga pengar har dragits."); return; }
    try{
      const d=await api("checkout-status?session_id="+encodeURIComponent(q.get("session_id")||""));
      if(d.paid&&d.bookingId===b.id){ b.pay="betald"; b.paidAt=Date.now(); b.receipt=d.receiptUrl||""; save(); toast("Betalningen är klar"); render(); }
      else toast("Betalningen är inte bekräftad än. Ladda om sidan om en stund.");
    }catch(e){ toast("Kunde inte kontrollera betalningen. "+e.message); }
  }
}

function km(a,b){ const R=6371,r=x=>x*Math.PI/180; const dLat=r(b[0]-a[0]), dLng=r(b[1]-a[1]); const h=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

function genExamples(){
  const out=[], start=addDays(today(),-7);
  for(let i=0;i<380;i++){
    const date=addDays(start,i), dt=parse(date), r=rng(hash("passa"+date));

    let p=.62; if(wd===5||wd===6||wd===0) p+=.25; if(mo===6||mo===7||mo===11) p+=.18; if(mo===1||mo===3) p+=.06;

    const n=1+(r()<.6?1:0)+(r()<.35?1:0)+(r()<.15?1:0);

let storageOk = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk=true; } catch(e){ storageOk=false; toast("Kunde inte spara i webbläsaren. Ändringen gäller tills du laddar om."); } }

const allSitters = () => [...S.sitters, ...SEED_SITTERS];
const getSitter = id => allSitters().find(s=>s.id===id);
const allRequests = () => [...S.requests, ...EXAMPLES];
const getRequest = id => allRequests().find(r=>r.id===id);
function contact(cid){
  if(!cid) return null;
  if(cid[0]==="o"){ const r=getRequest(cid.slice(1)); return r? {cid,name:r.owner,sub:`Äger ${r.dog.name}, ${r.city}`,example:r.example,link:"#uppdrag-"+r.id,req:r}:null; }
  const s=getSitter(cid); return s? {cid,name:s.name,sub:`Hundvakt i ${s.city}`,example:s.example,link:"#hundvakt-"+s.id,sitter:s}:null;
}
const myName = () => S.me.name.trim() || "Du";
function ratingOf(id){ const r=S.reviews.filter(x=>x.sitterId===id); if(!r.length) return null; return {avg:r.reduce((a,b)=>a+b.stars,0)/r.length,n:r.length}; }
function starStr(v){ const f=Math.round(v); return "★".repeat(f)+"☆".repeat(5-f); }
const AV=[["#173a3b","#fbf7ee"],["#fd795b","#173a3b"],["#2f6b5e","#fbf7ee"],["#f3c9a8","#173a3b"],["#4c5d8a","#fbf7ee"],["#c9dfd6","#173a3b"]];
const avColor = name => { let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))>>>0; return AV[h%AV.length]; };
function avatar(p,cls=""){ const ini=p.name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); const [bg,fg]=avColor(p.name); return `<div class="av ${cls}" aria-hidden="true" style="background:${bg};color:${fg}">${p.photo && /^data:image\//.test(p.photo) ? `<img src="${esc(p.photo)}" alt="">` : esc(ini)}</div>`; }
function dogAv(dog,cls=""){ const [bg,fg]=avColor(dog.name+dog.breed); return `<div class="dogav ${cls}" aria-hidden="true" style="background:${bg};color:${fg}">${I.paw}</div>`; }
const contactAv = c => c.req? dogAv(c.req.dog,"sm") : avatar(c.sitter,"sm");
const svcChip = k => `<span class="chip">${I[SVC[k].icon]}${SVC[k].label}</span>`;
function cityDist(lat,lng,cityName){ const c=findCity(cityName); return c? km(CITIES[c],[lat,lng]) : null; }
const distLabel = d => d==null? "" : d<1? "< 1 km" : Math.round(d)+" km";
function minPrice(s,svc){ if(svc&&svc!=="alla"&&s.prices[svc]) return [s.prices[svc],svc]; let best=null; for(const k of s.services){ if(best==null||s.prices[k]<best[0]) best=[s.prices[k],k]; } return best||[0,"promenad"]; }
function reqDates(r){ const out=[]; let d=r.from; for(let i=0;i<31&&d<=r.to;i++){ out.push(d); d=addDays(d,1);} return out; }
function reqWhen(r){
  if(r.service==="promenad") return `${fmtDate(r.from)} kl ${r.time} · ${String(r.hours).replace(".",",")} h`;
  if(r.service==="dagis") return r.to===r.from? `${fmtDate(r.from)} · heldag` : `${fmtDate(r.from)} – ${fmtDate(r.to)}`;
  const n=diffDays(r.from,r.to); return `${fmtDate(r.from)} – ${fmtDate(r.to)} · ${n} ${n===1?"natt":"nätter"}`;
}
function units(svc,from,to,hours){ if(svc==="promenad") return +hours||0; if(svc==="dagis") return Math.max(1,diffDays(from,to)+1); return Math.max(1,diffDays(from,to)); }
function unitLabel(svc,n){ const s=SVC[svc]; return `${String(n).replace(".",",")} ${n===1?s.unit:s.units}`; }

/* ---------- Routing ---------- */
function go(h){ if(location.hash==="#"+h) render(); else location.hash=h; }
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });
const NAV=[["start","Hem",I.search,["start","sok","hundvakt","boka"]],["kalender","Uppdrag",I.cal,["kalender","uppdrag","nytt"]],["bokningar","Bokningar",I.list,["bokningar"]],["meddelanden","Meddelanden",I.chat,["meddelanden","chatt"]],["profil","Profil",I.user,["profil","annons"]]];
function renderNav(route){
  const unread=S.messages.filter(m=>!m.read&&!m.mine).length;
  const html=NAV.map(([h,l,ic,m])=>`<a href="#${h}" ${m.includes(route)?'aria-current="page"':""}>${ic}<span>${l}</span>${h==="meddelanden"&&unread?`<span class="dot-badge">${unread}</span>`:""}</a>`).join("");
  $("#tabs").innerHTML=html; $("#topnav").innerHTML=html;
}
const after={};
function render(){
  const h=(location.hash||"#start").slice(1);
  const i=h.indexOf("-"); const route= i>0? h.slice(0,i):h; const arg= i>0? h.slice(i+1):null;
  const views={start,sok,hundvakt,boka,kalender,uppdrag,nytt,bokningar,meddelanden,chatt,annons,profil};
  const key=views[route]?route:"start";
  renderNav(key);
  const narrow=["boka","nytt","bokningar","meddelanden","chatt","annons","profil"].includes(key);
  $("#app").innerHTML=`<div class="page${narrow?" narrow":""}">${views[key](arg)}</div><footer class="foot"><div class="in"><span><b style="color:var(--ink)">Passa</b> · Hundpassning nära dig · Prototyp</span><span>Kortbetalning via Stripe</span></div></footer>`;
  document.title={start:"Passa",sok:"Hitta hundvakt · Passa",kalender:"Uppdragskalender · Passa",nytt:"Lägg ut uppdrag · Passa",bokningar:"Bokningar · Passa",meddelanden:"Meddelanden · Passa",profil:"Profil · Passa",annons:"Bli hundvakt · Passa"}[key]||"Passa";
  (after[key]||(()=>{}))(arg);
}
const backBtn = (label="Tillbaka") => `<button class="back" type="button" data-back>${I.left}${label}</button>`;
document.addEventListener("click",e=>{ if(e.target.closest("[data-back]")){ if(history.length>1) history.back(); else go("start"); } });

/* ---------- Kort ---------- */
function sitterCard(x,svc){
  const d=cityDist(x.lat,x.lng,S.search.city), r=ratingOf(x.id), [p,k]=minPrice(x,svc);
  return `<article class="card scard"><div class="scard-top">${avatar(x)}<div><h3 class="trunc">${esc(x.name)}</h3><p class="muted small trunc">${esc(x.city)}${d!=null?" · "+distLabel(d):""}</p></div><div class="price">${kr(p)}<small>per ${SVC[k].unit}</small></div></div>
   <p class="clamp small">${esc(x.bio)}</p>
   <div class="chips">${x.services.map(svcChip).join("")}${x.example?`<span class="chip ex">Exempel</span>`:`<span class="chip ok">Din annons</span>`}</div>
   <div class="scard-foot"><span class="small">${r?`<span class="stars">★</span> <b>${r.avg.toFixed(1)}</b> <span class="muted">(${r.n})</span>`:`<span class="muted">Inga omdömen än</span>`}</span><a class="btn sm" href="#hundvakt-${esc(x.id)}">Visa profil</a></div></article>`;
}
function reqCard(r,cityName){
  const d=cityDist(r.lat,r.lng,cityName), offered=S.offers.includes(r.id);
  return `<a class="card req" href="#uppdrag-${esc(r.id)}">${dogAv(r.dog)}
   <div class="stack" style="gap:5px;min-width:0"><div class="trunc"><b>${esc(r.dog.name)}</b> <span class="muted">· ${esc(r.dog.breed)}</span></div>
    <p class="muted xs trunc">${esc(SIZE_SHORT[r.dog.size]||"")} · ${esc(r.city)}${d!=null?" · "+distLabel(d):""}</p>
    <div class="chips">${svcChip(r.service)}${r.mine?`<span class="chip ok">Ditt uppdrag</span>`:offered?`<span class="chip o">Erbjudande skickat</span>`:""}</div></div>
   <div class="pay"><b>${kr(r.pay)}</b><small>${r.service==="promenad"?"kl "+esc(r.time):r.service==="natt"?diffDays(r.from,r.to)+" "+(diffDays(r.from,r.to)===1?"natt":"nätter"):"heldag"}</small></div></a>`;
}
function filteredRequests(f){
  const c=findCity(f.city);
  return allRequests().filter(r=>(f.service==="alla"||r.service===f.service) && (!c||f.radius==="alla"||km(CITIES[c],[r.lat,r.lng])<=+f.radius));
}

/* ---------- Start ---------- */
function start(){
  const s=S.search, t=today(), city=findCity(s.city)||"Umeå";
  const upcoming=filteredRequests({city,radius:"50",service:"alla"}).filter(r=>r.from>=t).sort((a,b)=>a.from.localeCompare(b.from)||a.time.localeCompare(b.time));
  const week=upcoming.filter(r=>r.from<=addDays(t,7)).length;
  const nearCount=allSitters().filter(x=>km(CITIES[city],[x.lat,x.lng])<=50).length;
  const near=allSitters().map(x=>({x,d:km(CITIES[city],[x.lat,x.lng])})).sort((a,b)=>a.d-b.d).slice(0,3).map(o=>o.x);
  return `<section class="hero">
    <div style="min-width:0"><p class="eyebrow">Hundpassning nära dig</p>
      <h1>En trygg hundvakt, <em>när du behöver det.</em></h1>
      <p class="lead">Hitta någon som går promenaden, tar hunden på dagis eller har den hemma över natten. Betala tryggt med kort via Stripe.</p>
      <div class="facts"><div><b>${nearCount}</b><span>hundvakter nära ${esc(city)}</span></div><div><b>${week}</b><span>uppdrag kommande 7 dagar</span></div><div><b>3</b><span>sorters passning</span></div></div></div>
    <form id="searchForm" class="sbox"><h2 style="font-size:1.3rem">Hitta en hundvakt</h2>
      <fieldset><legend>Vad behöver hunden?</legend><div class="seg" role="group">${svcSeg("data-svc",s.service)}</div></fieldset>
      <div class="grid2"><label for="f-city">Ort<input id="f-city" list="cityList" value="${esc(s.city)}" autocomplete="off" placeholder="t.ex. Umeå"></label>
      <label for="f-radius">Avstånd<select id="f-radius">${radiusOpts(s.radius)}</select></label></div>
      <datalist id="cityList">${CITY_NAMES.map(c=>`<option value="${c}">`).join("")}</datalist>
      <button class="btn orange" type="submit">${I.search} Visa hundvakter</button></form>
  </section>
  <div class="paths">
    <a class="card path" href="#kalender"><span class="pic" style="background:var(--orange-soft);color:var(--orange-ink)">${I.cal}</span><div><h3>Är du hundvakt?</h3><p class="muted small">Bläddra i kalendern och se vilka hundägare som söker hjälp, dag för dag året runt.</p></div><span class="go">${I.right}</span></a>
    <a class="card path" href="#nytt"><span class="pic" style="background:var(--green-soft);color:var(--green)">${I.plus}</span><div><h3>Lägg ut ett uppdrag</h3><p class="muted small">Berätta om din hund och vilka datum det gäller, så hör hundvakter av sig.</p></div><span class="go">${I.right}</span></a>
  </div>
  <div class="shead"><h2>Hundvakter nära ${esc(city)}</h2><a class="btn ghost sm" href="#sok">Visa alla</a></div>
  <div class="sgrid">${near.map(x=>sitterCard(x,"alla")).join("")}</div>
  <div class="shead"><h2>Nya uppdrag nära ${esc(city)}</h2><a class="btn ghost sm" href="#kalender">Öppna kalendern</a></div>
  <div class="reqlist">${upcoming.slice(0,4).map(r=>reqCard(r,city)).join("")||`<div class="card empty"><p class="muted">Inga uppdrag just nu.</p></div>`}</div>
  <p class="note" style="margin-top:28px"><b>Prototyp:</b> hundvakter och uppdrag märkta Exempel är påhittade, och ingen identitet är kontrollerad. Det du skapar sparas bara i din egen webbläsare.</p>`;
}
after.start=()=>{
  $$("[data-svc]").forEach(b=>b.onclick=()=>{ S.search.service=b.dataset.svc; $$("[data-svc]").forEach(x=>x.setAttribute("aria-pressed",x===b)); save(); });
  $("#searchForm").onsubmit=e=>{ e.preventDefault(); S.search.city=$("#f-city").value.trim(); S.search.radius=$("#f-radius").value; save(); go("sok"); };
};

/* ---------- Sök hundvakt ---------- */
function sok(){
  const s=S.search, city=findCity(s.city);
  let list=allSitters().filter(x=>s.service==="alla"||x.services.includes(s.service)).map(x=>({x,d:city?km(CITIES[city],[x.lat,x.lng]):null,r:ratingOf(x.id),p:minPrice(x,s.service)[0]}));
  if(city&&s.radius!=="alla") list=list.filter(o=>o.d<=+s.radius);
  const so={avstand:(a,b)=>(a.d??1e9)-(b.d??1e9),pris:(a,b)=>a.p-b.p,betyg:(a,b)=>(b.r?.avg??0)-(a.r?.avg??0)};
  list.sort(so[s.sort]||so.avstand);
  const where=city?(s.radius==="alla"?`nära ${city}`:`inom ${s.radius} km från ${city}`):"i hela Sverige";
  return `<div class="phead"><span class="eyebrow">Hitta hundvakt</span><h1>${list.length} ${list.length===1?"hundvakt":"hundvakter"} ${esc(where)}</h1>
   <p>${!city&&s.city?`Vi känner inte igen orten ”${esc(s.city)}”, så alla visas. `:""}<a href="#start">Ändra ort</a></p></div>
   <div class="toolbar"><div class="seg" role="group" aria-label="Tjänst">${svcSeg("data-t",s.service)}</div>
   <label for="f-sort" style="flex-direction:row;align-items:center;gap:8px">Sortera<select id="f-sort" style="width:auto">${[["avstand","Avstånd"],["pris","Lägst pris"],["betyg","Betyg"]].map(([v,l])=>`<option value="${v}" ${s.sort===v?"selected":""}>${l}</option>`).join("")}</select></label></div>
   ${list.length?`<div class="sgrid">${list.map(o=>sitterCard(o.x,s.service)).join("")}</div>`:`<div class="card empty"><div class="ill">${I.search}</div><b>Inga hundvakter inom ${esc(s.radius)} km</b><p class="muted small">Prova ett större avstånd eller en annan tjänst.</p><button class="btn ghost sm" id="widen">Visa hela Sverige</button></div>`}`;
}
after.sok=()=>{
  $$("[data-t]").forEach(b=>b.onclick=()=>{S.search.service=b.dataset.t;save();render();});
  $("#f-sort").onchange=e=>{S.search.sort=e.target.value;save();render();};
  const w=$("#widen"); if(w) w.onclick=()=>{S.search.radius="alla";save();render();};
};

/* ---------- Hundvaktsprofil ---------- */
function hundvakt(id){
  const s=getSitter(id); if(!s) return `<div class="card empty"><b>Profilen finns inte längre.</b><a class="btn ghost sm" href="#sok">Till sökningen</a></div>`;
  const r=ratingOf(s.id), revs=S.reviews.filter(x=>x.sitterId===s.id).sort((a,b)=>b.ts-a.ts), d=cityDist(s.lat,s.lng,S.search.city), first=esc(s.name.split(" ")[0]);
  return `<div class="stack">${backBtn()}
  <div class="dgrid"><div class="stack" style="gap:20px">
   <div class="ph">${avatar(s,"lg")}<div class="stack" style="gap:6px"><h1>${esc(s.name)}</h1><p class="muted">${esc(s.city)}${d!=null?" · "+distLabel(d)+" bort":""}${r?` · <span class="stars">★</span> ${r.avg.toFixed(1)} (${r.n})`:""}</p><div class="chips">${s.services.map(svcChip).join("")}${s.example?`<span class="chip ex">Exempelprofil</span>`:`<span class="chip ok">Din annons</span>`}</div></div></div>
   <div class="card pad-lg stack" style="gap:16px"><h2>Om ${first}</h2><p>${esc(s.bio)}</p><hr>
    <dl class="facts"><div><dt>Erfarenhet</dt><dd>${esc(s.exp||"Ej angivet")}</dd></div><div><dt>Boende</dt><dd>${esc(s.home||"Ej angivet")}</dd></div><div><dt>Hundstorlek</dt><dd>${s.sizes.map(z=>SIZE_SHORT[z]).join(", ")}</dd></div><div><dt>Språk</dt><dd>${esc(s.lang||"Ej angivet")}</dd></div><div><dt>Identitet</dt><dd>Inte kontrollerad</dd></div></dl></div>
   <section class="stack" style="gap:12px"><h2>Omdömen ${r?`<span class="stars" style="font-size:1rem">${starStr(r.avg)}</span> <span class="muted small">${r.avg.toFixed(1)} av 5</span>`:""}</h2>
    ${revs.length?revs.map(v=>`<div class="card stack" style="gap:6px"><div class="row between"><b>${esc(v.author)}</b><span class="stars">${starStr(v.stars)}</span></div><p>${esc(v.text)}</p><p class="muted xs">${esc(SVC[v.service]?.label||"Pass")} · ${esc(fmtDate(v.date))}</p></div>`).join(""):`<p class="muted">Inga omdömen än. Omdömen kan bara lämnas efter en genomförd bokning.</p>`}</section>
  </div>
  <aside class="card pad-lg stack" style="gap:16px"><div class="plist">${s.services.map(k=>`<div><span>${I[SVC[k].icon]}${SVC[k].label}</span><b class="num">${kr(s.prices[k])} <span class="muted small" style="font-weight:500">/ ${SVC[k].unit}</span></b></div>`).join("")}</div>
   <a class="btn orange block" href="#boka-${esc(s.id)}">Boka ${first}</a><a class="btn ghost block" href="#chatt-${esc(s.id)}">${I.chat} Skriv till ${first}</a><hr>
   <div class="plist small"><b>Betalning</b><div><span>${I.card}Kort via Stripe</span><span class="muted">${stripeLabel(s)}</span></div></div>
   <p class="muted xs">Du betalar i Stripes kassa. Passa ser aldrig dina kortuppgifter.</p>
   ${!s.example?`<div class="paybox"><b>Dina utbetalningar</b><p class="small muted">${s.stripeReady?"Stripe är kopplat. Betalningar från hundägare betalas ut till ditt bankkonto enligt Stripes utbetalningsschema.":s.stripeAccount?"Du har påbörjat kopplingen men inte slutfört den hos Stripe.":"Koppla ett Stripe-konto så att hundägare kan betala dig med kort. Du fyller i dina uppgifter och ditt bankkonto hos Stripe."}</p><button type="button" class="btn ${s.stripeReady?"ghost":"orange"} sm" id="stripeBtn" style="align-self:flex-start">${I.card} ${s.stripeReady?"Öppna Stripe igen":s.stripeAccount?"Slutför kopplingen":"Koppla Stripe"}</button></div>`:""}</aside>
  </div></div>`;
}

after.hundvakt=id=>{
  const s=getSitter(id); if(!s||s.example) return;
  const b=$("#stripeBtn"); if(b) b.onclick=()=>connectStripe(s,b);
  if(s.stripeAccount&&!s.stripeReady) refreshStripe(s).then(()=>{ if(s.stripeReady) render(); });
};

/* ---------- Boka ---------- */
function boka(id){
  const s=getSitter(id); if(!s) return `<div class="card empty"><b>Profilen finns inte.</b><a class="btn ghost sm" href="#sok">Tillbaka</a></div>`;
  const t=today(), svc=s.services[0];
  return `<div class="stack">${backBtn()}
   <div class="row" style="gap:14px">${avatar(s)}<div><span class="eyebrow">Bokningsförfrågan</span><h1 style="font-size:1.7rem">Boka ${esc(s.name.split(" ")[0])}</h1></div></div>
   <form id="bookForm" class="card pad-lg stack">
    <fieldset><legend>Tjänst</legend><div class="seg" role="group">${s.services.map(k=>`<button type="button" data-bsvc="${k}" aria-pressed="${k===svc}">${I[SVC[k].icon]}${SVC[k].label} · ${kr(s.prices[k])}</button>`).join("")}</div></fieldset>
    <div class="grid2"><label for="b-dog">Hundens namn<input id="b-dog" required maxlength="40" placeholder="t.ex. Bamse"></label>
     <label for="b-size">Storlek<select id="b-size">${Object.entries(SIZES).filter(([k])=>s.sizes.includes(k)).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label></div>
    <div class="grid2"><label for="b-from"><span id="lbl-from">Datum</span><input id="b-from" type="date" required min="${t}" value="${addDays(t,1)}"></label>
     <label for="b-to" id="wrap-to" hidden><span id="lbl-to">Till och med</span><input id="b-to" type="date" min="${t}" value="${addDays(t,2)}"></label>
     <label for="b-time" id="wrap-time">Starttid<input id="b-time" type="time" value="12:00"></label></div>
    <label for="b-hours" id="wrap-hours">Antal timmar<input id="b-hours" type="number" min="0.5" max="12" step="0.5" value="1"></label>
    <label for="b-note">Bra att veta<textarea id="b-note" maxlength="600" placeholder="Ras, ålder, mat, mediciner, hur hunden fungerar med andra hundar…"></textarea></label>
    <div class="paybox"><div class="sumrow"><span class="muted" id="b-units"></span><b id="b-sum"></b></div></div>
    <div class="stack" style="gap:8px"><span class="lbl">Betalning</span>
     <div class="payopt" style="cursor:default"><span class="pm-ico">${I.card}</span><span><b>Kort via Stripe</b><span class="muted small">När förfrågan är skickad betalar du under Bokningar, i Stripes säkra kassa. Passa ser aldrig dina kortuppgifter.</span></span></div></div>
    <button class="btn orange" type="submit">${I.send} Skicka förfrågan</button>
   </form></div>`;
}
after.boka=id=>{
  const s=getSitter(id); if(!s) return;
  let svc=s.services[0];
  const upd=()=>{
    $("#wrap-time").hidden = svc!=="promenad"; $("#wrap-hours").hidden = svc!=="promenad"; $("#wrap-to").hidden = svc==="promenad";
    $("#lbl-from").textContent = svc==="natt"?"Lämning":svc==="dagis"?"Från":"Datum";
    $("#lbl-to").textContent = svc==="natt"?"Hämtning":"Till och med";
    const from=$("#b-from").value;
    if(svc==="natt"&&$("#b-to").value<=from) $("#b-to").value=addDays(from,1);
    if(svc==="dagis"&&$("#b-to").value<from) $("#b-to").value=from;
    const n=units(svc,from,svc==="promenad"?from:$("#b-to").value,$("#b-hours").value);
    $("#b-units").textContent=`${unitLabel(svc,n)} × ${kr(s.prices[svc])}`; $("#b-sum").textContent=kr(n*s.prices[svc]);
  };
  $$("[data-bsvc]").forEach(b=>b.onclick=()=>{svc=b.dataset.bsvc;$$("[data-bsvc]").forEach(x=>x.setAttribute("aria-pressed",x===b));upd();});
  ["#b-from","#b-to","#b-hours"].forEach(q=>$(q).addEventListener("input",upd));
  upd();
  $("#bookForm").onsubmit=e=>{ e.preventDefault();
    const from=$("#b-from").value, to=svc==="promenad"?from:$("#b-to").value, hours=+$("#b-hours").value;
    if(!from){toast("Välj ett datum");return;}
    const n=units(svc,from,to,hours);
    const b={id:uid()+uid(),sitterId:s.id,service:svc,dog:$("#b-dog").value.trim(),size:$("#b-size").value,from,to,time:svc==="promenad"?$("#b-time").value:"",hours:svc==="promenad"?hours:0,units:n,price:s.prices[svc],total:n*s.prices[svc],note:$("#b-note").value.trim(),status:"forfragan",pay:"obetald",created:Date.now()};
    S.bookings.push(b);
    S.messages.push({id:uid(),cid:s.id,mine:true,read:true,ts:Date.now(),text:`Bokningsförfrågan: ${SVC[svc].label} för ${b.dog}, ${bookingWhen(b)}. ${b.note}`.trim()});
    save(); toast("Förfrågan skickad"); go("bokningar");
  };
};
function bookingWhen(b){
  if(b.service==="promenad") return `${fmtDate(b.from)} kl ${b.time}, ${unitLabel("promenad",b.hours)}`;
  if(b.service==="dagis") return b.to===b.from? fmtDate(b.from) : `${fmtDate(b.from)} – ${fmtDate(b.to)}`;
  return `${fmtDate(b.from)} – ${fmtDate(b.to)}, ${unitLabel("natt",b.units)}`;
}

/* ---------- Uppdragskalender ---------- */
function kalender(){
  const c=S.cal, t=today(), thisMonth=ym(t), maxMonth=addMonths(thisMonth,11);
  if(c.month<thisMonth) c.month=thisMonth; if(c.month>maxMonth) c.month=maxMonth;
  if(c.day<t) c.day=t; if(ym(c.day)!==c.month) c.day=c.month===thisMonth?t:c.month+"-01";
  const city=findCity(c.city), reqs=filteredRequests(c).filter(r=>r.to>=t);
  const byDay={}; for(const r of reqs) for(const d of reqDates(r)) (byDay[d]=byDay[d]||[]).push(r);
  const months=[]; for(let i=0;i<12;i++){ const m=addMonths(thisMonth,i); months.push([m,reqs.filter(r=>ym(r.from)===m).length]); }
  const maxM=Math.max(1,...months.map(x=>x[1]));
  const [Y,M]=c.month.split("-").map(Number), first=new Date(Y,M-1,1), offset=(first.getDay()+6)%7, dim=new Date(Y,M,0).getDate();
  let cells=""; for(let i=0;i<offset;i++) cells+=`<span class="day blank" aria-hidden="true"></span>`;
  for(let d=1;d<=dim;d++){
    const ds=`${c.month}-${pad(d)}`, n=(byDay[ds]||[]).length, past=ds<t;
    const lvl= n===0?"":n<=1?"l1":n<=3?"l2":"l3";
    cells+=`<button type="button" class="day ${lvl} ${ds===t?"today":""}" data-day="${ds}" aria-pressed="${ds===c.day}" ${past?"disabled":""} aria-label="${esc(fmtLong(ds))}, ${n} uppdrag"><span class="d">${d}</span>${n&&!past?`<span class="c">${n}</span>`:""}</button>`;
  }
  const dayReqs=(byDay[c.day]||[]).slice().sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const monthTotal=months.find(x=>x[0]===c.month)?.[1]||0;
  return `<div class="phead"><span class="eyebrow">För hundvakter</span><h1>Uppdragskalender</h1><p>Bläddra genom året och se vilka hundägare som söker hundvakt. Välj en dag för att se uppdragen.</p></div>
   <div class="filters">
    <label for="c-city">Ort<input id="c-city" list="cityList2" value="${esc(c.city)}" autocomplete="off"></label>
    <label for="c-radius">Avstånd<select id="c-radius">${radiusOpts(c.radius)}</select></label>
    <div class="seg" role="group" aria-label="Tjänst">${svcSeg("data-csvc",c.service)}</div>
    <datalist id="cityList2">${CITY_NAMES.map(x=>`<option value="${x}">`).join("")}</datalist>
   </div>
   <div class="months" role="group" aria-label="Välj månad">${months.map(([m,n])=>`<button type="button" data-month="${m}" aria-pressed="${m===c.month}"><b>${esc(fmtMonthShort(m))}${m.slice(0,4)!==thisMonth.slice(0,4)?" "+m.slice(0,4):""}</b><span>${n} uppdrag</span><span class="bar-mini"><i style="width:${Math.round(n/maxM*100)}%"></i></span></button>`).join("")}</div>
   <div class="calwrap">
    <div class="card pad-lg">
     <div class="calhead"><button type="button" class="icon-btn" id="prevM" aria-label="Föregående månad" ${c.month<=thisMonth?"disabled":""}>${I.left}</button><h2>${esc(fmtMonth(c.month))}</h2><button type="button" class="btn ghost sm" id="todayBtn">Idag</button><button type="button" class="icon-btn" id="nextM" aria-label="Nästa månad" ${c.month>=maxMonth?"disabled":""}>${I.right}</button></div>
     <div class="wk" aria-hidden="true">${["mån","tis","ons","tor","fre","lör","sön"].map(w=>`<span>${w}</span>`).join("")}</div>
     <div class="cal">${cells}</div>
     <div class="legend"><span><i style="background:var(--orange-soft)"></i>1 uppdrag</span><span><i style="background:var(--orange)"></i>2–3</span><span><i style="background:var(--green)"></i>4 eller fler</span><span class="num">${monthTotal} uppdrag startar i ${esc(fmtMonth(c.month).split(" ")[0])}</span></div>
    </div>
    <section class="daypanel stack" style="gap:12px" aria-live="polite">
     <div><h2>${esc(fmtLong(c.day))}</h2><p class="muted small">${dayReqs.length} ${dayReqs.length===1?"hundägare söker":"hundägare söker"} hundvakt${city&&c.radius!=="alla"?` inom ${esc(c.radius)} km från ${esc(city)}`:""}</p></div>
     ${dayReqs.length?`<div class="reqlist">${dayReqs.map(r=>reqCard(r,c.city)).join("")}</div>`:`<div class="card empty"><div class="ill">${I.paw}</div><b>Inga uppdrag den här dagen</b><p class="muted small">Välj en annan dag, öka avståndet eller lägg ut ett eget uppdrag.</p><a class="btn ghost sm" href="#nytt">Lägg ut uppdrag</a></div>`}
    </section>
   </div>
   ${!city&&c.city?`<p class="muted small" style="margin-top:12px">Vi känner inte igen orten ”${esc(c.city)}”, så uppdrag i hela Sverige visas.</p>`:""}`;
}
after.kalender=()=>{

  $$("[data-day]").forEach(b=>b.onclick=()=>{c.day=b.dataset.day;rerender(); if(innerWidth<960) setTimeout(()=>$(".daypanel")?.scrollIntoView({behavior:"smooth",block:"start"}),30);});

/* ---------- Uppdrag ---------- */

/* ---------- Bokningar ---------- */
let bookTab="kommande";
function bokningar(){
  const t=today(), isPast=b=>b.status!=="forfragan"||b.to<t;
  const list=S.bookings.filter(b=>bookTab==="kommande"?!isPast(b):isPast(b)).sort((a,b)=>bookTab==="kommande"?a.from.localeCompare(b.from):b.from.localeCompare(a.from));
  const label={forfragan:["Förfrågan skickad","st-req"],genomford:["Genomförd","st-done"],avbokad:["Avbokad","st-cancel"]};
  const payL={obetald:["Ej betald","st-req"],betald:["Betald via Stripe","st-done"],bekraftad:["Betald","st-done"]};
  return `<div class="phead"><span class="eyebrow">Som hundägare</span><h1>Bokningar</h1></div>
   <div class="seg" role="group" aria-label="Visa" style="margin-bottom:16px">${[["kommande","Kommande"],["tidigare","Tidigare"]].map(([v,l])=>`<button type="button" data-tab="${v}" aria-pressed="${bookTab===v}">${l}</button>`).join("")}</div>
   ${list.length?`<div class="stack" style="gap:12px">${list.map(b=>{const s=getSitter(b.sitterId)||{name:"Borttagen hundvakt",id:""}; const reviewed=S.reviews.some(r=>r.bookingId===b.id); const [lt,lc]=label[b.status]||label.forfragan; const [pt,pc]=payL[b.pay]||payL.obetald; const overdue=b.status==="forfragan"&&b.to<t;
    return `<article class="card stack" style="gap:12px"><div class="row between" style="flex-wrap:nowrap"><div class="row" style="gap:12px;flex-wrap:nowrap;min-width:0;flex:1">${avatar(s,"sm")}<div style="min-width:0"><h3 class="trunc">${esc(s.name)}</h3><p class="muted small trunc">${SVC[b.service].label} · ${esc(b.dog)}</p></div></div><span class="status ${lc}">${lt}</span></div>
     <div class="row between small num"><span>${esc(bookingWhen(b))}</span><b>${kr(b.total)}</b></div>
     ${b.status!=="avbokad"?`<div class="row small"><span class="muted">Betalning</span><span class="status ${pc}">${pt}</span></div>`:""}
     <div class="row">
      ${b.status!=="avbokad"&&(b.pay||"obetald")==="obetald"?`<button class="btn sm orange" data-act="pay" data-id="${b.id}">${I.card} Betala med kort</button>`:""}
      ${b.receipt&&/^https:\/\//.test(b.receipt)?`<a class="btn sm ghost" href="${esc(b.receipt)}" target="_blank" rel="noopener">Kvitto</a>`:""}
      ${b.status==="forfragan"?`${overdue?`<button class="btn sm" data-act="done" data-id="${b.id}">Markera som genomförd</button>`:""}${b.pay!=="betald"?`<button class="btn sm ghost" data-act="cancel" data-id="${b.id}">Avboka</button>`:""}`:""}
      ${b.status==="genomford"&&!reviewed?`<button class="btn sm orange" data-act="review" data-id="${b.id}">Lämna omdöme</button>`:""}
      ${b.status==="genomford"&&reviewed?`<span class="muted small">Omdöme lämnat</span>`:""}
      ${s.id?`<a class="btn sm ghost" href="#chatt-${esc(s.id)}">Meddelande</a>`:""}
     </div><div id="rv-${b.id}"></div></article>`;}).join("")}</div>`
   :`<div class="card empty"><div class="ill">${I.list}</div><b>${bookTab==="kommande"?"Inga kommande bokningar":"Inga tidigare bokningar"}</b><p class="muted small">${bookTab==="kommande"?"Hitta en hundvakt och skicka en förfrågan.":"Genomförda och avbokade pass hamnar här."}</p>${bookTab==="kommande"?`<a class="btn sm" href="#sok">Hitta hundvakt</a>`:""}</div>`}
   ${bookTab==="kommande"&&S.bookings.length?`<p class="muted small" style="margin-top:14px">När datumet har passerat kan du markera passet som genomfört och lämna ett omdöme.</p>`:""}`;
}
after.bokningar=()=>{
  $$("[data-tab]").forEach(b=>b.onclick=()=>{bookTab=b.dataset.tab;render();});
  $$("[data-act]").forEach(btn=>btn.onclick=()=>{
    const b=S.bookings.find(x=>x.id===btn.dataset.id); if(!b) return;
    const a=btn.dataset.act;
    if(a==="cancel"){ b.status="avbokad"; save(); toast("Bokningen är avbokad"); render(); }
    if(a==="done"){ b.status="genomford"; save(); bookTab="tidigare"; toast("Markerad som genomförd"); render(); }
    if(a==="review") reviewForm(b);

function reviewForm(b){

  box.innerHTML=`<form class="paybox"><b>Hur gick det?</b><div class="rate" role="group" aria-label="Betyg">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n} av 5">★</button>`).join("")}</div>

    S.reviews.push({id:uid(),bookingId:b.id,sitterId:b.sitterId,service:b.service,stars,text:$("#rv-t-"+b.id).value.trim(),author:myName(),date:b.from,ts:Date.now()}); save(); toast("Omdömet är publicerat"); render(); };

   :`<div class="card empty"><div class="ill">${I.chat}</div><b>Inga konversationer än</b><p class="muted small">Skriv till en hundvakt från profilen, eller erbjud dig på ett uppdrag i kalendern.</p></div>`}`;
}
function chatt(cid){
  const c=contact(cid); if(!c) return `<div class="card empty"><b>Konversationen finns inte.</b><a class="btn ghost sm" href="#meddelanden">Till meddelanden</a></div>`;
  const ms=S.messages.filter(m=>m.cid===cid);
  return `<div class="stack">${backBtn()}
   <a class="lrow" href="${c.link}">${contactAv(c)}<div class="grow"><b>${esc(c.name)}</b><p class="muted xs">${esc(c.sub)} · ${c.req?"Visa uppdraget":"Visa profil"}</p></div></a>
   <div class="card stack"><div class="chat" id="chatBox">${ms.length?ms.map(m=>`<div class="msg ${m.mine?"me":""}">${esc(m.text)}<time>${esc(fmtTime(m.ts))}</time></div>`).join(""):`<p class="muted small empty">Skriv ditt första meddelande till ${esc(c.name.split(" ")[0])}.</p>`}</div>
   <form id="msgForm" class="row" style="flex-wrap:nowrap"><label for="m-text" class="grow" aria-label="Meddelande"><input id="m-text" maxlength="1000" autocomplete="off" placeholder="Skriv ett meddelande" required></label><button class="btn" type="submit" aria-label="Skicka">${I.send}</button></form></div>
   ${c.example?`<p class="muted xs">Det här är ${c.req?"ett exempeluppdrag":"en exempelprofil"}, så ingen svarar. Meddelanden sparas bara i din webbläsare.</p>`:""}</div>`;
}
after.chatt=cid=>{
  S.messages.forEach(m=>{if(m.cid===cid)m.read=true;}); save();
  const box=$("#chatBox"); if(box) box.scrollTop=box.scrollHeight;
  const f=$("#msgForm"); if(!f) return;
  f.onsubmit=e=>{e.preventDefault(); const t=$("#m-text").value.trim(); if(!t) return; S.messages.push({id:uid(),cid,mine:true,read:true,ts:Date.now(),text:t}); save(); render(); $("#m-text")?.focus();};
};

/* ---------- Bli hundvakt ---------- */
let pendingPhoto=null;
function annons(){
  return `<div class="stack">${backBtn()}
  <div class="phead" style="margin:0"><span class="eyebrow">Bli hundvakt</span><h1>Skapa din annons</h1><p>Hundägare i närheten hittar dig i sökningen. Du sätter dina egna priser och får betalt med kort via Stripe.</p></div>
  ${S.sitters.length?`<div class="stack" style="gap:8px"><h3>Dina annonser</h3>${S.sitters.map(s=>`<div class="lrow" style="cursor:default">${avatar(s,"sm")}<div class="grow"><b>${esc(s.name)}</b><p class="muted xs">${esc(s.city)} · ${s.services.map(k=>SVC[k].label).join(", ")}</p></div><a class="btn sm ghost" href="#hundvakt-${esc(s.id)}">Visa</a><button class="btn sm ghost" data-del="${esc(s.id)}">Ta bort</button></div>`).join("")}</div>`:""}
  <form id="adForm" class="card pad-lg stack">
   <div class="row" style="gap:16px"><div id="photoPrev">${avatar({name:S.me.name||"Ny hundvakt",photo:pendingPhoto},"lg")}</div><label for="a-photo" class="grow" style="min-width:200px">Profilbild (valfri)<input id="a-photo" type="file" accept="image/*"></label></div>
   <div class="grid2"><label for="a-name">Namn<input id="a-name" required maxlength="60" value="${esc(S.me.name)}" placeholder="För- och efternamn"></label><label for="a-city">Ort<select id="a-city">${cityOpts(findCity(S.me.city)||"Umeå")}</select></label></div>
   <fieldset class="stack" style="gap:10px"><legend>Tjänster och pris</legend>
    ${Object.entries(SVC).map(([k,v],i)=>`<div class="svcrow"><label class="check" for="a-s-${k}"><input id="a-s-${k}" type="checkbox" ${i===0?"checked":""}> <span>${v.label}<br><span class="hint">${v.hint}</span></span></label><label for="a-p-${k}" aria-label="Pris per ${v.unit}"><input id="a-p-${k}" type="number" min="50" max="5000" step="10" value="${{promenad:140,dagis:350,natt:430}[k]}"><span class="hint">kr per ${v.unit}</span></label></div>`).join("")}
   </fieldset>
   <fieldset><legend>Hundstorlekar du tar emot</legend><div class="row">${Object.entries(SIZES).map(([k,v])=>`<label class="check" for="a-z-${k}"><input id="a-z-${k}" type="checkbox" checked> ${v}</label>`).join("")}</div></fieldset>
   <label for="a-home">Boende<input id="a-home" maxlength="80" placeholder="t.ex. Villa med inhägnad trädgård"></label>
   <label for="a-bio">Om dig<textarea id="a-bio" required maxlength="600" placeholder="Din erfarenhet av hundar, hur en dag med dig ser ut, när du kan…"></textarea></label>
   <div class="grid2"><label for="a-exp">Erfarenhet<input id="a-exp" maxlength="80" placeholder="t.ex. Egen hund i 5 år"></label><label for="a-lang">Språk<input id="a-lang" maxlength="80" placeholder="t.ex. Svenska, engelska"></label></div>
   <p class="note small">När annonsen är publicerad kopplar du Stripe på din profil för att kunna ta emot kortbetalningar. Annonsen visas bara i den här webbläsaren, och identitetskontroll finns inte än.</p>
   <button class="btn orange" type="submit">Publicera annons</button>
  </form></div>`;
}
after.annons=()=>{
  $$("[data-del]").forEach(b=>b.onclick=()=>{ if(b.dataset.c){ S.sitters=S.sitters.filter(s=>s.id!==b.dataset.del); save(); toast("Annonsen är borttagen"); render(); } else { b.dataset.c="1"; b.textContent="Bekräfta"; b.classList.add("orange"); }});
  $("#a-photo").onchange=e=>{ const f=e.target.files[0]; if(!f) return; if(!/^image\//.test(f.type)){toast("Välj en bildfil");return;}
    const rd=new FileReader(); rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement("canvas"),z=240; c.width=c.height=z; const m=Math.min(img.width,img.height); c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z); pendingPhoto=c.toDataURL("image/jpeg",.82); $("#photoPrev").innerHTML=avatar({name:"x",photo:pendingPhoto},"lg"); }; img.onerror=()=>toast("Bilden kunde inte läsas"); img.src=rd.result; }; rd.readAsDataURL(f); };
  $("#adForm").onsubmit=e=>{ e.preventDefault();
    const services=Object.keys(SVC).filter(k=>$("#a-s-"+k).checked), sizes=Object.keys(SIZES).filter(k=>$("#a-z-"+k).checked);
    if(!services.length){toast("Välj minst en tjänst");return;} if(!sizes.length){toast("Välj minst en hundstorlek");return;}
    const city=$("#a-city").value, c=CITIES[city], prices={}; services.forEach(k=>prices[k]=+$("#a-p-"+k).value||0);
    const s={id:"u"+uid(),name:$("#a-name").value.trim(),city,lat:c[0],lng:c[1],services,prices,sizes,home:$("#a-home").value.trim(),bio:$("#a-bio").value.trim(),exp:$("#a-exp").value.trim(),lang:$("#a-lang").value.trim(),photo:pendingPhoto,stripeAccount:"",stripeReady:false,example:false};
    S.sitters.unshift(s); if(!S.me.name) S.me.name=s.name; pendingPhoto=null; save(); toast("Annonsen är publicerad. Koppla Stripe för att ta emot betalningar."); go("hundvakt-"+s.id);
  };
};

/* ---------- Profil ---------- */
function profil(){
  const mine=S.requests, offered=S.offers.map(getRequest).filter(Boolean);
  return `<div class="phead"><h1>Profil</h1></div>
  <div class="stack">
  <form id="meForm" class="card pad-lg stack"><h3>Dina uppgifter</h3><div class="grid2"><label for="p-name">Namn<input id="p-name" maxlength="60" value="${esc(S.me.name)}" placeholder="Visas på omdömen och uppdrag"></label><label for="p-city">Hemort<select id="p-city">${cityOpts(findCity(S.me.city)||"Umeå")}</select></label></div><button class="btn" type="submit" style="align-self:flex-start">Spara</button></form>
  <div class="card pad-lg stack" style="gap:12px"><div class="row between"><h3>Mina uppdrag</h3><a class="btn sm ghost" href="#nytt">${I.plus} Nytt uppdrag</a></div>
   ${mine.length?`<div class="reqlist">${mine.map(r=>reqCard(r,S.me.city)).join("")}</div>`:`<p class="muted small">Du har inte lagt ut några uppdrag.</p>`}</div>
  <div class="card pad-lg stack" style="gap:12px"><h3>Uppdrag du har erbjudit dig på</h3>
   ${offered.length?`<div class="reqlist">${offered.map(r=>reqCard(r,S.me.city)).join("")}</div>`:`<p class="muted small">Inga än. <a href="#kalender">Öppna kalendern</a> för att hitta uppdrag.</p>`}</div>
  <a class="card path" href="#annons"><span class="pic" style="background:var(--orange-soft);color:var(--orange-ink)">${I.paw}</span><div><h3>${S.sitters.length?"Dina hundvaktsannonser":"Bli hundvakt"}</h3><p class="muted small">${S.sitters.length?`${S.sitters.length} ${S.sitters.length===1?"annons":"annonser"}. Lägg till eller ta bort.`:"Skapa en annons och ta emot bokningar från hundägare."}</p></div><span class="go">${I.right}</span></a>
  <div class="card pad-lg stack" style="gap:10px"><h3>Din data</h3><p class="small muted">${S.bookings.length} bokningar, ${S.messages.length} meddelanden, ${S.requests.length} uppdrag, ${S.reviews.length} omdömen och ${S.sitters.length} annonser. Allt ligger bara i den här webbläsaren${storageOk?"":" (sparning fungerar inte just nu)"}.</p><button class="btn ghost sm" id="reset" style="align-self:flex-start">Radera all min data</button></div>
  <div class="card pad-lg stack" style="gap:8px"><h3>Om prototypen</h3><p class="small muted">Sök, avstånd, uppdragskalender, bokningar, meddelanden, annonser och omdömen fungerar. Kortbetalning och utbetalningar via Stripe Connect fungerar när appen körs med Passas server. Inloggning, BankID, identitetskontroll och delning mellan användare finns inte än.</p></div>
  </div>`;
}
after.profil=()=>{
  $("#meForm").onsubmit=e=>{e.preventDefault(); S.me.name=$("#p-name").value.trim(); S.me.city=$("#p-city").value; S.search.city=S.me.city; S.cal.city=S.me.city; save(); toast("Sparat");};
  const r=$("#reset"); r.onclick=()=>{ if(r.dataset.c){ S=freshState(); save(); toast("All data är raderad"); render(); } else { r.dataset.c="1"; r.textContent="Klicka igen för att radera allt"; r.classList.add("orange"); } };
};

$("#logoMark").innerHTML=I.paw;
checkPay();
$("#ctaNew").innerHTML=I.plus+"<span>Lägg ut uppdrag</span>";
render();
handleReturn();
})();
</script>
</body>
</html>
